# One service, no database. Values come from a .env file next to this file (optional).
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
    image: apapo-api:local
    ports:
      - "${PORT:-8080}:8080"
    environment:
      PORT: "8080"
      APP_SECRET: ${APP_SECRET:-}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-}
      DEV_OTP: ${DEV_OTP:-123456}
      PROVIDER: ${PROVIDER:-mock}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      VERSION: ${VERSION:-dev}
    restart: unless-stopped
